spring:
  application:
    name: castro-advocacia-plataforma

  # Perfil ativo: dev (H2) ou prod (PostgreSQL)
  profiles:
    active: dev

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

server:
  port: 8080

---
# Perfil DEV — banco H2 em memória
spring:
  config:
    activate:
      on-profile: dev

  datasource:
    url: jdbc:h2:mem:castrodev
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

---
# Perfil PROD — PostgreSQL
spring:
  config:
    activate:
      on-profile: prod

  datasource:
    url: ${DATABASE_URL}
    driver-class-name: org.postgresql.Driver
    username: ${DATABASE_USER}
    password: ${DATABASE_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
